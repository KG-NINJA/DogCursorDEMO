<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Cursor Control (High Speed - COCO-SSD)</title>
    <!-- COI for consistency, though less critical for bare TFJS WebGL -->
    <script src="coi-serviceworker.js"></script>

    <link rel="stylesheet" href="style.css">

    <!-- Load TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <!-- Load COCO-SSD model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</head>

<body>
    <div class="container">
        <h1>Dog Cursor Control <span style="color: #00ff00; font-size: 0.8em;">(High Speed)</span></h1>
        <div id="status">Loading COCO-SSD Model...</div>

        <div class="view-container">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="overlay"></canvas>
            <div id="cursor"></div>
        </div>

        <div class="controls">
            <p>Engine: TensorFlow.js (COCO-SSD) | FPS: <span id="fps">0</span></p>
            <div style="margin-top: 15px;">
                <a href="index.html" class="btn">Switch to Precision Mode (YOLOv8)</a>
            </div>
        </div>

        <!-- On-screen Console for Debugging on GH Pages -->
        <div id="console-log"
            style="width: 80%; margin: 20px auto; background: #333; color: #0f0; padding: 10px; font-family: monospace; text-align: left; height: 100px; overflow-y: scroll; border: 1px solid #555; font-size: 0.8rem;">
            <div>> System Initialized</div>
        </div>
    </div>

    <!-- Logger Script -->
    <script>
        const logBox = document.getElementById('console-log');
        const originalLog = console.log;
        const originalError = console.error;

        function uiLog(message, isError = false) {
            const div = document.createElement('div');
            div.textContent = "> " + message;
            if (isError) div.style.color = '#ff5555';
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        console.log = function (...args) {
            originalLog.apply(console, args);
            uiLog(args.join(' '));
        };
        console.error = function (...args) {
            originalError.apply(console, args);
            uiLog(args.join(' '), true);
        };
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            uiLog(`Uncaught: ${msg} (${lineNo}:${columnNo})`, true);
            return false;
        };
    </script>

    <script src="script_ssd.js"></script>
</body>

</html>
